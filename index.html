<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Operacions aleatòries</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 18px;
      background-color: #f4f4f4;
    }

    h1 {
      font-size: 27px;
      margin: 8px 0 10px 0;
    }

    /* CONFIGURACIÓ */

    .configuracio {
      margin: 6px;
      font-size: 13px;
    }

    .bloc {
      display: inline-block;
      padding: 6px 9px;
      margin: 3px;
      background-color: white;
      border-radius: 7px;
      font-size: 12px;
    }

    .bloc strong {
      font-size: 13px;
    }

    input {
      font-size: 12px;
      width: 57px;
      padding: 3px;
      margin: 2px;
      text-align: center;
    }

    /* OPERACIÓ */

    #operacio {
      font-size: 82px;
      font-weight: bold;
      margin: 24px 15px 12px 15px;
    }

    /* COMPTE ENRERE */

    #temps {
      font-size: 46px;
      font-weight: bold;
      margin: 10px;
    }

    /* RESULTAT */

    #resultat {
      font-size: 46px;
      font-weight: bold;
      margin: 10px;
      min-height: 52px;
    }

    /* BOTONS */

    button {
      font-size: 17px;
      padding: 9px 18px;
      margin: 5px;
      cursor: pointer;
    }

    /* RECTA NUMÈRICA */

    #contenidorRecta {
      display: none;
      width: 90%;
      max-width: 950px;
      margin: 15px auto 20px auto;
      background-color: white;
      border-radius: 8px;
      padding: 8px 12px;
      box-sizing: border-box;
    }

    #rectaNumerica {
      width: 100%;
      height: 125px;
      overflow: visible;
    }

    /* LÍNIA PRINCIPAL */

    .liniaRecta {
      stroke: #222;
      stroke-width: 3;
    }

    /* UNITATS */

    .marcaUnitat {
      stroke: #222;
      stroke-width: 2.5;
    }

    /* DÈCIMES */

    .marcaDecima {
      stroke: #777;
      stroke-width: 1.3;
    }

    /* NÚMEROS DE LES UNITATS */

    .numeroMarca {
      font-size: 17px;
      text-anchor: middle;
    }

    /* RESULTAT */

    .puntResultat {
      fill: #d62828;
    }

    .textResultat {
      font-size: 21px;
      font-weight: bold;
      text-anchor: middle;
      fill: #d62828;
    }
  </style>
</head>

<body>

  <h1>Operació aleatòria</h1>


  <!-- TEMPS -->

  <div class="configuracio">

    Temps:

    <input
      type="number"
      id="minuts"
      value="1"
      min="0"
    >
    min

    <input
      type="number"
      id="segons"
      value="0"
      min="0"
      max="59"
    >
    s

  </div>


  <!-- PRIMER NÚMERO -->

  <div class="bloc">

    <strong>Primer número</strong>

    &nbsp; Mín:
    <input
      type="number"
      id="min1"
      value="0"
      step="0.001"
    >

    Màx:
    <input
      type="number"
      id="max1"
      value="999"
      step="0.001"
    >

    Decimals:
    <input
      type="number"
      id="decimals1"
      value="3"
      min="0"
      max="10"
    >

  </div>


  <!-- SEGON NÚMERO -->

  <div class="bloc">

    <strong>Segon número</strong>

    &nbsp; Mín:
    <input
      type="number"
      id="min2"
      value="0"
      step="0.001"
    >

    Màx:
    <input
      type="number"
      id="max2"
      value="999"
      step="0.001"
    >

    Decimals:
    <input
      type="number"
      id="decimals2"
      value="3"
      min="0"
      max="10"
    >

  </div>


  <!-- OPERACIÓ -->

  <div id="operacio">---</div>


  <!-- COMPTE ENRERE -->

  <div id="temps">01:00</div>


  <!-- RESULTAT -->

  <div id="resultat"></div>


  <!-- BOTONS -->

  <button onclick="generarOperacio()">
    Nova operació
  </button>

  <button onclick="mostrarResultat()">
    Mostrar resultat
  </button>


  <!-- RECTA NUMÈRICA -->

  <div id="contenidorRecta">

    <svg
      id="rectaNumerica"
      viewBox="0 0 1000 140"
      preserveAspectRatio="xMidYMid meet"
    ></svg>

  </div>


  <script>

    let resultatActual = 0;
    let temporitzador;
    let tempsRestant = 60;
    let hiHaOperacio = false;


    // GENERAR NÚMERO

    function generarNumero(minim, maxim, decimals) {

      let factor =
        Math.pow(10, decimals);

      let minimEnter =
        Math.ceil(minim * factor);

      let maximEnter =
        Math.floor(maxim * factor);

      let numeroEnter =
        Math.floor(
          Math.random() *
          (maximEnter - minimEnter + 1)
        ) + minimEnter;

      return numeroEnter / factor;
    }


    // ACTUALITZAR RELLOTGE

    function actualitzarTemps() {

      let minuts =
        Math.floor(tempsRestant / 60);

      let segons =
        tempsRestant % 60;

      document.getElementById("temps").textContent =

        String(minuts).padStart(2, "0") +
        ":" +
        String(segons).padStart(2, "0");

    }


    // GENERAR OPERACIÓ

    function generarOperacio() {

      clearInterval(temporitzador);


      // RANGS

      let min1 =
        Number(
          document.getElementById("min1").value
        );

      let max1 =
        Number(
          document.getElementById("max1").value
        );

      let min2 =
        Number(
          document.getElementById("min2").value
        );

      let max2 =
        Number(
          document.getElementById("max2").value
        );


      // DECIMALS

      let decimals1 =
        Number(
          document.getElementById("decimals1").value
        );

      let decimals2 =
        Number(
          document.getElementById("decimals2").value
        );


      // COMPROVACIÓ

      if (min1 > max1 || min2 > max2) {

        alert(
          "El mínim no pot ser superior al màxim."
        );

        return;
      }


      // GENERAR NÚMEROS

      let numero1 =
        generarNumero(
          min1,
          max1,
          decimals1
        );

      let numero2 =
        generarNumero(
          min2,
          max2,
          decimals2
        );


      // OPERACIÓ

      let operacions =
        ["+", "−", "×", "÷"];

      let operacio =
        operacions[
          Math.floor(
            Math.random() *
            operacions.length
          )
        ];


      // EVITAR DIVISIÓ ENTRE ZERO

      if (operacio === "÷") {

        while (numero2 === 0) {

          numero2 =
            generarNumero(
              min2,
              max2,
              decimals2
            );

        }

      }


      // RESULTAT

      if (operacio === "+") {

        resultatActual =
          numero1 + numero2;

      }

      else if (operacio === "−") {

        resultatActual =
          numero1 - numero2;

      }

      else if (operacio === "×") {

        resultatActual =
          numero1 * numero2;

      }

      else if (operacio === "÷") {

        resultatActual =
          numero1 / numero2;

      }


      // MOSTRAR OPERACIÓ

      document.getElementById(
        "operacio"
      ).textContent =

        numero1
          .toFixed(decimals1)
          .replace(".", ",") +

        " " +

        operacio +

        " " +

        numero2
          .toFixed(decimals2)
          .replace(".", ",");


      // AMAGAR RESULTAT I RECTA

      document.getElementById(
        "resultat"
      ).textContent = "";

      document.getElementById(
        "contenidorRecta"
      ).style.display = "none";


      hiHaOperacio = true;


      // TEMPS

      let minuts =
        Number(
          document.getElementById(
            "minuts"
          ).value
        );

      let segons =
        Number(
          document.getElementById(
            "segons"
          ).value
        );


      tempsRestant =
        (minuts * 60) + segons;


      actualitzarTemps();


      if (tempsRestant <= 0) {

        mostrarResultat();
        return;

      }


      temporitzador =
        setInterval(function() {

          tempsRestant--;

          actualitzarTemps();


          if (tempsRestant <= 0) {

            clearInterval(
              temporitzador
            );

            mostrarResultat();

          }

        }, 1000);

    }


    // MOSTRAR RESULTAT

    function mostrarResultat() {

      if (!hiHaOperacio) {
        return;
      }

      clearInterval(temporitzador);


      let resultatMostrat =
        resultatActual
          .toFixed(3)
          .replace(".", ",");


      document.getElementById(
        "resultat"
      ).textContent =

        "= " + resultatMostrat;


      dibuixarRecta(
        resultatActual
      );

    }


    // DIBUIXAR RECTA NUMÈRICA

    function dibuixarRecta(resultat) {

      let contenidor =
        document.getElementById(
          "contenidorRecta"
        );

      let svg =
        document.getElementById(
          "rectaNumerica"
        );


      svg.innerHTML = "";


      /*
        Mostrem una recta que cobreix
        6 unitats completes.

        El resultat queda aproximadament
        al centre.
      */

      let centre =
        Math.floor(resultat);

      let minim =
        centre - 3;

      let maxim =
        centre + 3;


      /*
        Si el resultat és exactament molt
        proper al límit, mantenim espai
        suficient als dos costats.
      */

      if (resultat - minim < 1) {
        minim--;
        maxim--;
      }

      if (maxim - resultat < 1) {
        minim++;
        maxim++;
      }


      // DIMENSIONS

      let xInicial = 60;
      let xFinal = 940;

      let yRecta = 75;

      let amplada =
        xFinal - xInicial;


      // LÍNIA PRINCIPAL

      let linia =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );

      linia.setAttribute("x1", xInicial);
      linia.setAttribute("y1", yRecta);
      linia.setAttribute("x2", xFinal);
      linia.setAttribute("y2", yRecta);
      linia.setAttribute(
        "class",
        "liniaRecta"
      );

      svg.appendChild(linia);


      // FLETXA

      let fletxa =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "polygon"
        );

      fletxa.setAttribute(
        "points",
        "940,75 925,67 925,83"
      );

      fletxa.setAttribute(
        "fill",
        "#222"
      );

      svg.appendChild(fletxa);


      /*
        SUBDIVISIONS

        Cada unitat es divideix
        en 10 parts.

        Per tant:
        1 marca gran = 1 unitat
        1 marca petita = 0,1
      */

      let totalDecimes =
        Math.round(
          (maxim - minim) * 10
        );


      for (
        let i = 0;
        i <= totalDecimes;
        i++
      ) {

        let valor =
          minim + (i / 10);

        let x =
          xInicial +

          (
            (valor - minim) /
            (maxim - minim)
          ) *

          amplada;


        // COMPROVEM SI ÉS UNA UNITAT

        let esUnitat =
          i % 10 === 0;


        // CREAR MARCA

        let marca =
          document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
          );


        marca.setAttribute(
          "x1",
          x
        );

        marca.setAttribute(
          "x2",
          x
        );


        if (esUnitat) {

          // MARCA GRAN

          marca.setAttribute(
            "y1",
            yRecta - 12
          );

          marca.setAttribute(
            "y2",
            yRecta + 12
          );

          marca.setAttribute(
            "class",
            "marcaUnitat"
          );

        }

        else {

          // MARCA PETITA

          marca.setAttribute(
            "y1",
            yRecta - 5
          );

          marca.setAttribute(
            "y2",
            yRecta + 5
          );

          marca.setAttribute(
            "class",
            "marcaDecima"
          );

        }


        svg.appendChild(marca);


        // NOMÉS ESCRIVIM LES UNITATS

        if (esUnitat) {

          let text =
            document.createElementNS(
              "http://www.w3.org/2000/svg",
              "text"
            );

          text.setAttribute(
            "x",
            x
          );

          text.setAttribute(
            "y",
            yRecta + 36
          );

          text.setAttribute(
            "class",
            "numeroMarca"
          );

          text.textContent =
            Math.round(valor);

          svg.appendChild(text);

        }

      }


      // POSICIÓ MATEMÀTICA EXACTA DEL RESULTAT

      let xResultat =

        xInicial +

        (
          (resultat - minim) /
          (maxim - minim)
        ) *

        amplada;


      // LÍNIA VERTICAL DEL RESULTAT

      let indicador =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );

      indicador.setAttribute(
        "x1",
        xResultat
      );

      indicador.setAttribute(
        "y1",
        35
      );

      indicador.setAttribute(
        "x2",
        xResultat
      );

      indicador.setAttribute(
        "y2",
        yRecta
      );

      indicador.setAttribute(
        "stroke",
        "#d62828"
      );

      indicador.setAttribute(
        "stroke-width",
        "2"
      );

      svg.appendChild(indicador);


      // PUNT DEL RESULTAT

      let punt =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "circle"
        );

      punt.setAttribute(
        "cx",
        xResultat
      );

      punt.setAttribute(
        "cy",
        yRecta
      );

      punt.setAttribute(
        "r",
        7
      );

      punt.setAttribute(
        "class",
        "puntResultat"
      );

      svg.appendChild(punt);


      // VALOR DEL RESULTAT

      let etiqueta =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "text"
        );

      etiqueta.setAttribute(
        "x",
        xResultat
      );

      etiqueta.setAttribute(
        "y",
        25
      );

      etiqueta.setAttribute(
        "class",
        "textResultat"
      );

      etiqueta.textContent =
        resultat
          .toFixed(3)
          .replace(".", ",");


      svg.appendChild(etiqueta);


      // MOSTRAR RECTA

      contenidor.style.display =
        "block";

    }

  </script>

</body>
</html>
