<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Operacions aleatòries</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 70px;
      background-color: #f4f4f4;
    }

    h1 {
      font-size: 36px;
    }

    #operacio {
      font-size: 60px;
      font-weight: bold;
      margin: 35px;
    }

    #temps {
      font-size: 50px;
      font-weight: bold;
      margin: 25px;
    }

    #resultat {
      font-size: 45px;
      font-weight: bold;
      margin: 30px;
    }

    .configuracio {
      margin: 25px;
      font-size: 20px;
    }

    input {
      font-size: 20px;
      width: 70px;
      padding: 5px;
      text-align: center;
    }

    button {
      font-size: 22px;
      padding: 12px 25px;
      margin: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Operació aleatòria</h1>

  <div class="configuracio">
    Temps:

    <input
      type="number"
      id="minuts"
      value="1"
      min="0"
    >
    min

    <input
      type="number"
      id="segons"
      value="0"
      min="0"
      max="59"
    >
    s
  </div>

  <div id="operacio">---</div>

  <div id="temps">01:00</div>

  <div id="resultat"></div>

  <button onclick="generarOperacio()">
    Nova operació
  </button>

  <button onclick="mostrarResultat()">
    Mostrar resultat
  </button>


  <script>

    let resultatActual = 0;
    let temporitzador;
    let tempsRestant = 60;


    function generarNumero() {
      return Number((Math.random() * 1000).toFixed(3));
    }


    function actualitzarTemps() {

      let minuts = Math.floor(tempsRestant / 60);
      let segons = tempsRestant % 60;

      document.getElementById("temps").textContent =
        String(minuts).padStart(2, "0") +
        ":" +
        String(segons).padStart(2, "0");
    }


    function generarOperacio() {

      clearInterval(temporitzador);

      let numero1 = generarNumero();
      let numero2 = generarNumero();

      let operacions = ["+", "−", "×", "÷"];

      let operacio =
        operacions[Math.floor(Math.random() * operacions.length)];


      // Calculem el resultat

      if (operacio === "+") {
        resultatActual = numero1 + numero2;
      }

      else if (operacio === "−") {
        resultatActual = numero1 - numero2;
      }

      else if (operacio === "×") {
        resultatActual = numero1 * numero2;
      }

      else if (operacio === "÷") {
        resultatActual = numero1 / numero2;
      }


      // Mostrem l'operació

      document.getElementById("operacio").textContent =
        numero1.toFixed(3).replace(".", ",") +
        " " +
        operacio +
        " " +
        numero2.toFixed(3).replace(".", ",");


      // Esborrem el resultat anterior

      document.getElementById("resultat").textContent = "";


      // Llegim minuts i segons

      let minuts =
        Number(document.getElementById("minuts").value);

      let segons =
        Number(document.getElementById("segons").value);


      // Convertim tot a segons

      tempsRestant =
        (minuts * 60) + segons;


      // Mostrem el temps inicial

      actualitzarTemps();


      // Comença la compte enrere

      temporitzador = setInterval(function() {

        tempsRestant--;

        actualitzarTemps();


        if (tempsRestant <= 0) {

          clearInterval(temporitzador);

          mostrarResultat();

        }

      }, 1000);

    }


    function mostrarResultat() {

      // Aturem la compte enrere

      clearInterval(temporitzador);


      // Mostrem el resultat

      document.getElementById("resultat").textContent =
        "= " +
        resultatActual
          .toFixed(3)
          .replace(".", ",");

    }

  </script>

</body>
</html>
