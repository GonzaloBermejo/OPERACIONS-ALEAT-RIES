<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Operacions aleatòries</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 18px;
      background-color: #f4f4f4;
    }

    h1 {
      font-size: 27px;
      margin: 8px 0 10px 0;
    }

    .configuracio {
      margin: 8px;
      font-size: 16px;
    }

    .bloc {
      display: inline-block;
      padding: 9px 13px;
      margin: 4px;
      background-color: white;
      border-radius: 8px;
      font-size: 15px;
    }

    .bloc strong {
      font-size: 16px;
    }

    input {
      font-size: 15px;
      width: 70px;
      padding: 5px;
      margin: 3px;
      text-align: center;
    }

    #operacio {
      font-size: 82px;
      font-weight: bold;
      margin: 22px 15px 10px 15px;
    }

    #temps {
      font-size: 46px;
      font-weight: bold;
      margin: 8px;
    }

    #resultat {
      font-size: 62px;
      font-weight: bold;
      margin: 8px;
      min-height: 70px;
    }

    button {
      font-size: 17px;
      padding: 9px 18px;
      margin: 5px;
      cursor: pointer;
    }

    #contenidorRecta {
      display: none;
      width: 90%;
      max-width: 950px;
      margin: 35px auto 20px auto;
      background-color: white;
      border-radius: 8px;
      padding: 8px 12px;
      box-sizing: border-box;
    }

    #rectaNumerica {
      width: 100%;
      height: 125px;
      overflow: visible;
    }

    .liniaRecta {
      stroke: #222;
      stroke-width: 3;
    }

    .marcaUnitat {
      stroke: #222;
      stroke-width: 2.5;
    }

    .marcaDecima {
      stroke: #777;
      stroke-width: 1.3;
    }

    .numeroMarca {
      font-size: 17px;
      text-anchor: middle;
    }

    .puntResultat {
      fill: #d62828;
    }

    .textResultat {
      font-size: 24px;
      font-weight: bold;
      text-anchor: middle;
      fill: #d62828;
    }
  </style>
</head>

<body>

  <h1>Operació aleatòria</h1>


  <!-- TEMPS -->

  <div class="configuracio">

    Temps:

    <input
      type="number"
      id="minuts"
      value="1"
      min="0"
    >
    min

    <input
      type="number"
      id="segons"
      value="0"
      min="0"
      max="59"
    >
    s

  </div>


  <!-- PRIMER NÚMERO -->

  <div class="bloc">

    <strong>Primer número</strong>

    &nbsp; Mín:
    <input
      type="number"
      id="min1"
      value="0"
      step="0.001"
    >

    Màx:
    <input
      type="number"
      id="max1"
      value="999"
      step="0.001"
    >

    Decimals:
    <input
      type="number"
      id="decimals1"
      value="3"
      min="0"
      max="10"
    >

  </div>


  <!-- SEGON NÚMERO -->

  <div class="bloc">

    <strong>Segon número</strong>

    &nbsp; Mín:
    <input
      type="number"
      id="min2"
      value="0"
      step="0.001"
    >

    Màx:
    <input
      type="number"
      id="max2"
      value="999"
      step="0.001"
    >

    Decimals:
    <input
      type="number"
      id="decimals2"
      value="3"
      min="0"
      max="10"
    >

  </div>


  <!-- OPERACIÓ -->

  <div id="operacio">---</div>


  <!-- COMPTE ENRERE -->

  <div id="temps">01:00</div>


  <!-- RESULTAT -->

  <div id="resultat"></div>


  <!-- BOTONS -->

  <button onclick="generarOperacio()">
    Nova operació
  </button>

  <button onclick="mostrarResultat()">
    Mostrar resultat
  </button>


  <!-- RECTA NUMÈRICA -->

  <div id="contenidorRecta">

    <svg
      id="rectaNumerica"
      viewBox="0 0 1000 140"
      preserveAspectRatio="xMidYMid meet"
    ></svg>

  </div>


  <script>

    let resultatActual = 0;
    let temporitzador;
    let tempsRestant = 60;
    let hiHaOperacio = false;

    let operacioActual = "";
    let decimals1Actuals = 0;
    let decimals2Actuals = 0;


    // GENERAR NÚMERO

    function generarNumero(minim, maxim, decimals) {

      let factor = Math.pow(10, decimals);

      let minimEnter =
        Math.ceil(minim * factor);

      let maximEnter =
        Math.floor(maxim * factor);

      let numeroEnter =
        Math.floor(
          Math.random() *
          (maximEnter - minimEnter + 1)
        ) + minimEnter;

      return numeroEnter / factor;
    }


    // DECIMALS QUE HA DE TENIR EL RESULTAT

    function obtenirDecimalsResultat() {

      // SUMA I RESTA:
      // màxim nombre de decimals dels operands

      if (
        operacioActual === "+" ||
        operacioActual === "−"
      ) {

        return Math.max(
          decimals1Actuals,
          decimals2Actuals
        );

      }


      // MULTIPLICACIÓ:
      // suma dels decimals

      if (operacioActual === "×") {

        return (
          decimals1Actuals +
          decimals2Actuals
        );

      }


      // DIVISIÓ:
      // màxim nombre de decimals dels operands

      if (operacioActual === "÷") {

        return Math.max(
          decimals1Actuals,
          decimals2Actuals
        );

      }


      return 0;
    }


    // FORMATEJAR RESULTAT

    function formatarResultat(numero) {

      let decimals =
        obtenirDecimalsResultat();


      /*
        Arrodonim a la precisió
        corresponent a l'operació.
      */

      let text =
        numero.toFixed(decimals);


      /*
        Eliminem zeros finals
        que no aporten informació.

        3,750000 -> 3,75
        8,000000 -> 8
      */

      if (text.includes(".")) {

        text = text.replace(
          /0+$/,
          ""
        );

        text = text.replace(
          /\.$/,
          ""
        );

      }


      return text.replace(".", ",");

    }


    // ACTUALITZAR RELLOTGE

    function actualitzarTemps() {

      let minuts =
        Math.floor(tempsRestant / 60);

      let segons =
        tempsRestant % 60;

      document.getElementById(
        "temps"
      ).textContent =

        String(minuts).padStart(2, "0") +
        ":" +
        String(segons).padStart(2, "0");

    }


    // GENERAR OPERACIÓ

    function generarOperacio() {

      clearInterval(temporitzador);


      // RANGS

      let min1 =
        Number(
          document.getElementById(
            "min1"
          ).value
        );

      let max1 =
        Number(
          document.getElementById(
            "max1"
          ).value
        );

      let min2 =
        Number(
          document.getElementById(
            "min2"
          ).value
        );

      let max2 =
        Number(
          document.getElementById(
            "max2"
          ).value
        );


      // DECIMALS

      let decimals1 =
        Number(
          document.getElementById(
            "decimals1"
          ).value
        );

      let decimals2 =
        Number(
          document.getElementById(
            "decimals2"
          ).value
        );


      // COMPROVACIÓ

      if (
        min1 > max1 ||
        min2 > max2
      ) {

        alert(
          "El mínim no pot ser superior al màxim."
        );

        return;
      }


      // GENERAR NÚMEROS

      let numero1 =
        generarNumero(
          min1,
          max1,
          decimals1
        );

      let numero2 =
        generarNumero(
          min2,
          max2,
          decimals2
        );


      // OPERACIÓ ALEATÒRIA

      let operacions =
        ["+", "−", "×", "÷"];

      let operacio =
        operacions[
          Math.floor(
            Math.random() *
            operacions.length
          )
        ];


      // EVITAR DIVISIÓ ENTRE ZERO

      if (operacio === "÷") {

        /*
          Si el rang només permet zero,
          no podem generar una divisió.
          En aquest cas triem una altra
          operació.
        */

        let intents = 0;

        while (
          numero2 === 0 &&
          intents < 100
        ) {

          numero2 =
            generarNumero(
              min2,
              max2,
              decimals2
            );

          intents++;

        }


        if (numero2 === 0) {

          let altres =
            ["+", "−", "×"];

          operacio =
            altres[
              Math.floor(
                Math.random() *
                altres.length
              )
            ];

        }

      }


      // GUARDAR INFORMACIÓ DE L'OPERACIÓ

      operacioActual =
        operacio;

      decimals1Actuals =
        decimals1;

      decimals2Actuals =
        decimals2;


      // CALCULAR RESULTAT

      if (operacio === "+") {

        resultatActual =
          numero1 + numero2;

      }

      else if (operacio === "−") {

        resultatActual =
          numero1 - numero2;

      }

      else if (operacio === "×") {

        resultatActual =
          numero1 * numero2;

      }

      else if (operacio === "÷") {

        resultatActual =
          numero1 / numero2;

      }


      // MOSTRAR OPERACIÓ

      document.getElementById(
        "operacio"
      ).textContent =

        numero1
          .toFixed(decimals1)
          .replace(".", ",") +

        " " +

        operacio +

        " " +

        numero2
          .toFixed(decimals2)
          .replace(".", ",");


      // AMAGAR RESULTAT I RECTA

      document.getElementById(
        "resultat"
      ).textContent = "";

      document.getElementById(
        "contenidorRecta"
      ).style.display = "none";


      hiHaOperacio = true;


      // TEMPS

      let minuts =
        Number(
          document.getElementById(
            "minuts"
          ).value
        );

      let segons =
        Number(
          document.getElementById(
            "segons"
          ).value
        );


      tempsRestant =
        (minuts * 60) + segons;


      actualitzarTemps();


      if (tempsRestant <= 0) {

        mostrarResultat();

        return;

      }


      // COMPTE ENRERE

      temporitzador =
        setInterval(function() {

          tempsRestant--;

          actualitzarTemps();


          if (tempsRestant <= 0) {

            clearInterval(
              temporitzador
            );

            mostrarResultat();

          }

        }, 1000);

    }


    // MOSTRAR RESULTAT

    function mostrarResultat() {

      if (!hiHaOperacio) {
        return;
      }


      clearInterval(
        temporitzador
      );


      document.getElementById(
        "resultat"
      ).textContent =

        "= " +
        formatarResultat(
          resultatActual
        );


      dibuixarRecta(
        resultatActual
      );

    }


    // DIBUIXAR RECTA NUMÈRICA

    function dibuixarRecta(resultat) {

      let contenidor =
        document.getElementById(
          "contenidorRecta"
        );

      let svg =
        document.getElementById(
          "rectaNumerica"
        );


      svg.innerHTML = "";


      // 6 UNITATS AL VOLTANT DEL RESULTAT

      let centre =
        Math.floor(resultat);

      let minim =
        centre - 3;

      let maxim =
        centre + 3;


      if (resultat - minim < 1) {

        minim--;
        maxim--;

      }


      if (maxim - resultat < 1) {

        minim++;
        maxim++;

      }


      // DIMENSIONS

      let xInicial = 60;
      let xFinal = 940;

      let yRecta = 75;

      let amplada =
        xFinal - xInicial;


      // LÍNIA PRINCIPAL

      let linia =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );

      linia.setAttribute(
        "x1",
        xInicial
      );

      linia.setAttribute(
        "y1",
        yRecta
      );

      linia.setAttribute(
        "x2",
        xFinal
      );

      linia.setAttribute(
        "y2",
        yRecta
      );

      linia.setAttribute(
        "class",
        "liniaRecta"
      );

      svg.appendChild(
        linia
      );


      // FLETXA

      let fletxa =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "polygon"
        );

      fletxa.setAttribute(
        "points",
        "940,75 925,67 925,83"
      );

      fletxa.setAttribute(
        "fill",
        "#222"
      );

      svg.appendChild(
        fletxa
      );


      // UNITATS I DÈCIMES

      let totalDecimes =
        Math.round(
          (maxim - minim) * 10
        );


      for (
        let i = 0;
        i <= totalDecimes;
        i++
      ) {

        let valor =
          minim + (i / 10);

        let x =
          xInicial +

          (
            (valor - minim) /
            (maxim - minim)
          ) *

          amplada;


        let esUnitat =
          i % 10 === 0;


        let marca =
          document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
          );


        marca.setAttribute(
          "x1",
          x
        );

        marca.setAttribute(
          "x2",
          x
        );


        if (esUnitat) {

          marca.setAttribute(
            "y1",
            yRecta - 12
          );

          marca.setAttribute(
            "y2",
            yRecta + 12
          );

          marca.setAttribute(
            "class",
            "marcaUnitat"
          );

        }

        else {

          marca.setAttribute(
            "y1",
            yRecta - 5
          );

          marca.setAttribute(
            "y2",
            yRecta + 5
          );

          marca.setAttribute(
            "class",
            "marcaDecima"
          );

        }


        svg.appendChild(
          marca
        );


        // ESCRIURE NOMÉS LES UNITATS

        if (esUnitat) {

          let text =
            document.createElementNS(
              "http://www.w3.org/2000/svg",
              "text"
            );

          text.setAttribute(
            "x",
            x
          );

          text.setAttribute(
            "y",
            yRecta + 36
          );

          text.setAttribute(
            "class",
            "numeroMarca"
          );

          text.textContent =
            Math.round(valor);

          svg.appendChild(
            text
          );

        }

      }


      // POSICIÓ EXACTA DEL RESULTAT

      let xResultat =

        xInicial +

        (
          (resultat - minim) /
          (maxim - minim)
        ) *

        amplada;


      // INDICADOR

      let indicador =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );

      indicador.setAttribute(
        "x1",
        xResultat
      );

      indicador.setAttribute(
        "y1",
        32
      );

      indicador.setAttribute(
        "x2",
        xResultat
      );

      indicador.setAttribute(
        "y2",
        yRecta
      );

      indicador.setAttribute(
        "stroke",
        "#d62828"
      );

      indicador.setAttribute(
        "stroke-width",
        "2"
      );

      svg.appendChild(
        indicador
      );


      // PUNT

      let punt =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "circle"
        );

      punt.setAttribute(
        "cx",
        xResultat
      );

      punt.setAttribute(
        "cy",
        yRecta
      );

      punt.setAttribute(
        "r",
        7
      );

      punt.setAttribute(
        "class",
        "puntResultat"
      );

      svg.appendChild(
        punt
      );


      // ETIQUETA DEL RESULTAT

      let etiqueta =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "text"
        );

      etiqueta.setAttribute(
        "x",
        xResultat
      );

      etiqueta.setAttribute(
        "y",
        22
      );

      etiqueta.setAttribute(
        "class",
        "textResultat"
      );

      etiqueta.textContent =
        formatarResultat(
          resultat
        );


      svg.appendChild(
        etiqueta
      );


      contenidor.style.display =
        "block";

    }

  </script>

</body>
</html>
