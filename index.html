<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Operacions aleatòries</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 35px;
      background-color: #f4f4f4;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    /* CONFIGURACIÓ DEL TEMPS */

    .configuracio {
      margin: 10px;
      font-size: 15px;
    }

    /* BLOCS DELS DOS NÚMEROS */

    .bloc {
      display: inline-block;
      padding: 8px 12px;
      margin: 5px;
      background-color: white;
      border-radius: 8px;
      font-size: 14px;
    }

    .bloc strong {
      font-size: 15px;
    }

    /* CAMPS D'ENTRADA */

    input {
      font-size: 14px;
      width: 65px;
      padding: 4px;
      margin: 3px;
      text-align: center;
    }

    /* OPERACIÓ: MOLT MÉS GRAN */

    #operacio {
      font-size: 95px;
      font-weight: bold;
      margin: 40px 20px 25px 20px;
    }

    /* COMPTE ENRERE */

    #temps {
      font-size: 55px;
      font-weight: bold;
      margin: 15px;
    }

    /* RESULTAT */

    #resultat {
      font-size: 55px;
      font-weight: bold;
      margin: 20px;
      min-height: 65px;
    }

    /* BOTONS */

    button {
      font-size: 20px;
      padding: 11px 22px;
      margin: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Operació aleatòria</h1>


  <!-- TEMPS -->

  <div class="configuracio">

    Temps:

    <input type="number" id="minuts" value="1" min="0">
    min

    <input type="number" id="segons" value="0" min="0" max="59">
    s

  </div>


  <!-- PRIMER NÚMERO -->

  <div class="bloc">

    <strong>Primer número</strong>

    &nbsp; Mín:
    <input type="number" id="min1" value="0" step="0.001">

    Màx:
    <input type="number" id="max1" value="999" step="0.001">

    Decimals:
    <input type="number" id="decimals1" value="3" min="0" max="10">

  </div>


  <!-- SEGON NÚMERO -->

  <div class="bloc">

    <strong>Segon número</strong>

    &nbsp; Mín:
    <input type="number" id="min2" value="0" step="0.001">

    Màx:
    <input type="number" id="max2" value="999" step="0.001">

    Decimals:
    <input type="number" id="decimals2" value="3" min="0" max="10">

  </div>


  <!-- OPERACIÓ -->

  <div id="operacio">---</div>


  <!-- COMPTE ENRERE -->

  <div id="temps">01:00</div>


  <!-- RESULTAT -->

  <div id="resultat"></div>


  <!-- BOTONS -->

  <button onclick="generarOperacio()">
    Nova operació
  </button>

  <button onclick="mostrarResultat()">
    Mostrar resultat
  </button>


  <script>

    let resultatActual = 0;
    let temporitzador;
    let tempsRestant = 60;


    function generarNumero(minim, maxim, decimals) {

      let factor = Math.pow(10, decimals);

      let minimEnter = Math.ceil(minim * factor);
      let maximEnter = Math.floor(maxim * factor);

      let numeroEnter =
        Math.floor(
          Math.random() * (maximEnter - minimEnter + 1)
        ) + minimEnter;

      return numeroEnter / factor;
    }


    function actualitzarTemps() {

      let minuts = Math.floor(tempsRestant / 60);
      let segons = tempsRestant % 60;

      document.getElementById("temps").textContent =
        String(minuts).padStart(2, "0") +
        ":" +
        String(segons).padStart(2, "0");
    }


    function generarOperacio() {

      clearInterval(temporitzador);


      let min1 =
        Number(document.getElementById("min1").value);

      let max1 =
        Number(document.getElementById("max1").value);

      let min2 =
        Number(document.getElementById("min2").value);

      let max2 =
        Number(document.getElementById("max2").value);


      let decimals1 =
        Number(document.getElementById("decimals1").value);

      let decimals2 =
        Number(document.getElementById("decimals2").value);


      if (min1 > max1 || min2 > max2) {

        alert("El mínim no pot ser superior al màxim.");
        return;

      }


      let numero1 =
        generarNumero(min1, max1, decimals1);

      let numero2 =
        generarNumero(min2, max2, decimals2);


      let operacions = ["+", "−", "×", "÷"];

      let operacio =
        operacions[
          Math.floor(Math.random() * operacions.length)
        ];


      if (operacio === "+") {

        resultatActual = numero1 + numero2;

      }

      else if (operacio === "−") {

        resultatActual = numero1 - numero2;

      }

      else if (operacio === "×") {

        resultatActual = numero1 * numero2;

      }

      else if (operacio === "÷") {

        resultatActual = numero1 / numero2;

      }


      document.getElementById("operacio").textContent =

        numero1
          .toFixed(decimals1)
          .replace(".", ",") +

        " " +

        operacio +

        " " +

        numero2
          .toFixed(decimals2)
          .replace(".", ",");


      document.getElementById("resultat").textContent = "";


      let minuts =
        Number(document.getElementById("minuts").value);

      let segons =
        Number(document.getElementById("segons").value);


      tempsRestant =
        (minuts * 60) + segons;


      actualitzarTemps();


      temporitzador = setInterval(function() {

        tempsRestant--;

        actualitzarTemps();


        if (tempsRestant <= 0) {

          clearInterval(temporitzador);
          mostrarResultat();

        }

      }, 1000);

    }


    function mostrarResultat() {

      clearInterval(temporitzador);

      document.getElementById("resultat").textContent =

        "= " +

        resultatActual
          .toFixed(3)
          .replace(".", ",");

    }

  </script>

</body>
</html>
