<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Operacions aleatòries</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
      background-color: #f4f4f4;
    }

    h1 {
      font-size: 36px;
    }

    #operacio {
      font-size: 60px;
      font-weight: bold;
      margin: 40px;
    }

    button {
      font-size: 24px;
      padding: 15px 30px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Operació aleatòria</h1>

  <div id="operacio">---</div>

  <button onclick="generarOperacio()">Generar operació</button>

  <script>

    function generarNumero() {
      // Número entre 0,000 y 999,999
      return (Math.random() * 1000).toFixed(3);
    }

    function generarOperacio() {

      // Generamos los dos números
      let numero1 = generarNumero();
      let numero2 = generarNumero();

      // Las cuatro operaciones básicas
      let operacions = ["+", "−", "×", "÷"];

      // Elegimos una operación al azar
      let operacio =
        operacions[Math.floor(Math.random() * operacions.length)];

      // Mostramos el ejercicio
      document.getElementById("operacio").textContent =
        numero1 + " " + operacio + " " + numero2;
    }

  </script>

</body>
</html>
